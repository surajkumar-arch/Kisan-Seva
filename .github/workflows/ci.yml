```yaml
name: EDAPHNET Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Security Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest ruff bandit

      - name: Code quality check
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Security audit
        run: bandit -r src apps -ll
        continue-on-error: true

  unit-integration-tests:
    name: Unit, Contract & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Verify project structure
        run: |
          pwd
          ls -la
          python -c "import os; print('src exists:', os.path.isdir('src')); print('apps exists:', os.path.isdir('apps'))"

      - name: Run Pytest Test Suite
        run: python -m pytest tests -v --tb=short

  container-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: unit-integration-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kisan-seva:ci .
