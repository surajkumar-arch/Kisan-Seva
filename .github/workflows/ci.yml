name: EDAPHNET Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # QUALITY & STATIC ANALYSIS
  # -------------------------------------------------------------------------
  code-quality:
    name: Code Quality & Security Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy bandit pip-audit

      - name: Code Formatting Check (Black)
        run: black --check src apps tests || true

      - name: Linting (Ruff)
        run: ruff check src apps tests || true

      - name: Static Security Scan (Bandit)
        run: bandit -r src apps -ll -ii || true

  # -------------------------------------------------------------------------
  # AUTOMATED TESTING SUITE
  # -------------------------------------------------------------------------
  test-suite:
    name: Unit, Contract & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install platform dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Pytest Test Suite
        env:
          APP_ENV: testing
          CLOUDINARY_CLOUD_NAME: stg42sga
          CLOUDINARY_API_KEY: "648173328782197"
          CLOUDINARY_API_SECRET: "OAZNGsjBpZkB8LZa-gLe6Ejggug"
        run: |
          pytest tests -v --tb=short

  # -------------------------------------------------------------------------
  # DOCKER CONTAINERIZATION
  # -------------------------------------------------------------------------
  docker-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: edaphnet:ci-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
