[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edaphnet"
version = "1.0.0"
description = "Enterprise Smart Agriculture Intelligence Platform with Dual Vision, OOD Detection, and Calibrated Recommendations"
readme = "README.md"
authors = [
    { name = "EDAPHNET Core Engineering Team" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "onnx>=1.16.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "pillow>=10.2.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "cloudinary>=1.39.0",
    "pymongo>=4.6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "apps*", "backend*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
